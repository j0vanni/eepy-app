name: Android APK

on:
  push:
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck & tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test -- --ci

  apk:
    name: Build APK
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history and tags: the release notes list the commits since the previous build.
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - name: Stamp the build number
        # CI-only, never committed: android.versionCode = run number. eepy reads it (expo-constants)
        # to know which build it is when checking GitHub for updates, and Android only installs an
        # APK over an older one when its versionCode is higher.
        run: |
          node -e '
            const fs = require("fs");
            const config = JSON.parse(fs.readFileSync("app.json", "utf8"));
            config.expo.android.versionCode = Number(process.env.GITHUB_RUN_NUMBER);
            fs.writeFileSync("app.json", JSON.stringify(config, null, 2) + "\n");
          '
          node -p '"android.versionCode = " + require("./app.json").expo.android.versionCode'
      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install
        env:
          CI: 1
      - name: Assemble release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --stacktrace
      - name: Collect APK
        id: apk
        run: |
          VERSION=$(node -p "require('./app.json').expo.version")
          NAME="eepy-${VERSION}-build${GITHUB_RUN_NUMBER}.apk"
          mkdir -p dist-apk
          cp android/app/build/outputs/apk/release/app-release.apk "dist-apk/${NAME}"
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"
          ls -la dist-apk
      - name: Release notes
        # eepy shows the "What's new" bullets in Settings → App updates and in its update notification.
        run: |
          PREV=$(git tag --list 'build-*' --sort=-v:refname | grep -vx "build-${GITHUB_RUN_NUMBER}" | sed -n 1p || true)
          if [ -n "$PREV" ]; then
            CHANGES=$(git log --no-merges -n 30 --format='- %s' "${PREV}..HEAD")
          else
            CHANGES=$(git log --no-merges -n 15 --format='- %s')
          fi
          [ -n "$CHANGES" ] || CHANGES="- Rebuild of ${GITHUB_SHA::7}"
          {
            echo "## What's new"
            echo
            echo "$CHANGES"
            echo
            echo "Android APK built from \`${GITHUB_REF_NAME}\` @ ${GITHUB_SHA}${PREV:+ (changes since ${PREV})}."
            echo
            echo '**Install:** open this page on your phone, download the `.apk`, and allow'
            echo '"Install unknown apps" for your browser when Android asks.'
            echo 'Then open eepy → Settings → Connect CMF Watch. Later builds install from'
            echo 'inside eepy: Settings → App updates.'
          } > release-notes.md
          cat release-notes.md
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: dist-apk/*.apk
          retention-days: 30
      - name: Publish as a GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: eepy build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          files: dist-apk/*.apk
          body_path: release-notes.md
