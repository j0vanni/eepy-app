name: Android APK

on:
  push:
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck & tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test -- --ci

  apk:
    name: Build APK
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - run: npm ci
      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install
        env:
          CI: 1
      - name: Assemble release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --stacktrace
      - name: Collect APK
        id: apk
        run: |
          VERSION=$(node -p "require('./app.json').expo.version")
          NAME="eepy-${VERSION}-build${GITHUB_RUN_NUMBER}.apk"
          mkdir -p dist-apk
          cp android/app/build/outputs/apk/release/app-release.apk "dist-apk/${NAME}"
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"
          ls -la dist-apk
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: dist-apk/*.apk
          retention-days: 30
      - name: Publish as a GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: eepy build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          files: dist-apk/*.apk
          body: |
            Android APK built from `${{ github.ref_name }}` @ ${{ github.sha }}.

            **Install:** open this page on your phone, download the `.apk`, and allow
            "Install unknown apps" for your browser when Android asks.
            Then open eepy → Settings → Connect CMF Watch.
